modules:
  jira:projectPage:
    - key: rovo-world-model-cockpit
      resource: custom-ui-cockpit
      resolver:
        function: ui-resolver-fn
      title: Rovo-World-Model
      layout: basic

  rovo:agent:
    - key: rovo-world-model-agent
      name: Rovo-World-Model Agent
      description: >-
        Rovo-World-Model Causal AI Digital Twin and Counterfactual Monte Carlo
        Risk Simulator powered by the Atlassian Teamwork Graph.
      prompt: |
        You are the **Rovo-World-Model Agent**, a Principal Causal AI & Delivery Risk Co-Pilot built on Rovo-World-Model and the Atlassian Teamwork Graph (TWG).

        Your mission is to help engineering leaders, product managers, and release captains understand structural dependencies, predict cascading schedule risks, and resolve delivery bottlenecks with mathematical confidence.

        ### Core Capabilities & Workflow
        1. **Counterfactual Risk Simulation ($do$-calculus):**
           When a user asks "What happens if [Issue] slips by [N] days?" or wants to stress-test a task, invoke the `simulate-delay-impact` action with `issueKey` and `delayDays`. Explain:
           - The baseline vs. intervened P50, P85, and P95 project completion dates and 3-tier schedule reserves.
           - The exact net ripple delay ($\Delta$ days) and the downstream **Blast Radius** issues across teams.
           - Which high-level **Teamwork Graph Goals** transition to `At Risk` or `Off Track`, plus Engineering Earned Value (`CPI`, `SPI`, `EAC`) and Brooks's Law staffing trade-offs.
        2. **Critical Path & Bottleneck Diagnosis:**
           When a user asks where the biggest delivery risks or bottlenecks are, invoke `analyze-critical-path`. Highlight the topological critical path, super-critical negative float tasks, each bottleneck's criticality index, mitigation ROI, and concrete de-risking recommendations.
        3. **Sample Issue Seeding for Empty Projects:**
           If the active Jira project has 0 issues and the user asks to populate sample linked tasks, invoke `seed-demo-scenario` to create linked sample Jira issues.

        Always ground your answers in the quantitative P50/P85/P95 probability percentiles, cite specific Jira issue keys, and provide actionable mitigation steps.
      conversationStarters:
        - Analyze our critical path, earned value health, and top delivery bottlenecks
        - What happens to our release goal if our top blocker issue slips by 8 days?
        - Populate sample linked Jira issues into this project
      actions:
        - simulate-delay-impact
        - analyze-critical-path
        - seed-demo-scenario

  action:
    - key: simulate-delay-impact
      name: Simulate Counterfactual Delay Impact
      function: rovo-simulate-delay-fn
      actionVerb: GET
      description: >-
        Applies a Pearl do-calculus intervention do(Issue = +delayDays) on the
        Project World Model DAG, runs a 500-iteration Monte Carlo simulation,
        and returns the cascading impact on release dates, downstream tasks, and
        Teamwork Graph goals.
      inputs:
        issueKey:
          title: Jira Issue Key
          type: string
          required: true
          description: The Jira issue key to delay (e.g., CHRON-104 or CHRON-102).
        delayDays:
          title: Delay Days
          type: integer
          required: true
          description: Number of counterfactual delay days to inject (+1 to +60).
        projectKey:
          title: Project Key
          type: string
          required: false
          description: Optional Jira project key (defaults to active project or CHRON).

    - key: analyze-critical-path
      name: Analyze Topological Critical Path & Bottlenecks
      function: rovo-critical-path-fn
      actionVerb: GET
      description: >-
        Performs cycle-safe topological sorting and 500-iteration Monte Carlo
        simulation on the project dependency graph to return top bottlenecks,
        criticality scores, and P50/P85/P95 completion forecasts.
      inputs:
        projectKey:
          title: Project Key
          type: string
          required: false
          description: Optional Jira project key (defaults to active project or CHRON).

    - key: seed-demo-scenario
      name: Seed Project Chronos Demo Scenario
      function: rovo-seed-demo-fn
      actionVerb: CREATE
      description: >-
        Loads the 18-node Project Chronos multi-team causal dependency graph
        across 3 teams and 2 Teamwork Graph goals, and optionally creates linked
        Jira issues in the target project.
      inputs:
        projectKey:
          title: Project Key
          type: string
          required: false
          description: Optional Jira project key in which to seed or store the demo graph.
        populateJiraIssues:
          title: Populate Linked Jira Issues
          type: boolean
          required: false
          description: Whether to attempt creating live linked Jira issues via Jira REST
            API.

  webtrigger:
    - key: mcp-world-model-endpoint
      function: mcp-webtrigger-fn
      response:
        type: dynamic

  function:
    - key: ui-resolver-fn
      handler: index.uiResolverHandler
    - key: rovo-simulate-delay-fn
      handler: index.simulateDelayImpactHandler
    - key: rovo-critical-path-fn
      handler: index.analyzeCriticalPathHandler
    - key: rovo-seed-demo-fn
      handler: index.seedDemoScenarioHandler
    - key: mcp-webtrigger-fn
      handler: index.mcpWebtriggerHandler

resources:
  - key: custom-ui-cockpit
    path: static/ui/build

app:
  id: ari:cloud:ecosystem::app/fee6c1b4-044f-4298-be43-9a2bf3e7fa06
  runtime:
    name: nodejs22.x
    memoryMB: 512
    architecture: arm64

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
